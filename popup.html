<!doctype html><html><head><meta charset="utf-8"><title>Railway Assistant</title><link rel="stylesheet" href="popup.css"></head><body><header><b>🚆 Railway Assistant</b><span>Bangladesh Railway</span></header><main><section><h3>🔎 Quick Search</h3><input id="from" placeholder="From station"><input id="to" placeholder="To station"><input id="date" type="date"><select id="class"><option value="">Class</option><option>Shuvon</option><option>Shuvon Chair</option><option>1st Seat</option><option>Snigdha</option><option>AC Seat</option><option>AC Berth</option></select><input id="qty" type="number" min="1" max="20" value="1" placeholder="Passengers"><button id="saveSearch">💾 Save Search</button><button id="fillSearch">⚡ Fill Search</button></section><section><h3>👥 Passenger Profiles</h3><select id="profile"></select><div class="row"><button id="add">＋ Add</button><button id="fill">⚡ Fill Profile</button></div><div id="list"></div></section><section><div class="row"><button class="light" id="clear">🧹 Clear</button><button class="light" id="open">🎫 Railway</button></div><button class="light" id="export">📤 Export Profiles</button><input id="import" type="file" accept=".json"><button class="light" id="theme">🌙 Toggle Dark Mode</button></section><p id="status"></p></main><footer>Review all details. CAPTCHA, OTP and payment are completed manually.</footer><script src="popup.js"></script></body></html>
