<!doctype html>
<html><head><meta charset="utf-8"><title>Railway Assistant</title><link rel="stylesheet" href="popup.css"></head>
<body><header><div><b>🚆 Railway Assistant</b><span>Bangladesh Railway</span></div><button id="lang" class="headbtn">বাংলা</button></header>
<main>
<section><h3 id="searchTitle">🔎 Quick Search</h3><input id="from" placeholder="From station"><input id="to" placeholder="To station"><input id="date" type="date">
<select id="class"><option value="">Class</option><option>Shuvon</option><option>Shuvon Chair</option><option>1st Seat</option><option>Snigdha</option><option>AC Seat</option><option>AC Berth</option></select>
<input id="qty" type="number" min="1" max="20" value="1" placeholder="Passengers"><div class="row"><button id="saveSearch">💾 Save Route</button><button id="fillSearch">⚡ Fill Search</button></div>
<select id="route"><option value="">Saved routes</option></select><button class="light" id="delRoute">🗑 Delete selected route</button></section>
<section><h3>👥 Passenger Profiles</h3><select id="profile"></select><div class="row"><button id="add">＋ Add</button><button id="fill">⚡ Fill Profile</button></div><div id="list"></div></section>
<section><h3>✅ Booking Checklist</h3><label><input type="checkbox" class="check"> Login complete</label><label><input type="checkbox" class="check"> Journey selected</label><label><input type="checkbox" class="check"> Passenger information checked</label><label><input type="checkbox" class="check"> CAPTCHA completed manually</label><label><input type="checkbox" class="check"> OTP completed manually</label><label><input type="checkbox" class="check"> Payment completed manually</label><div id="progress">0/6</div></section>
<section><h3>🔔 Journey Reminder</h3><input id="reminder" type="datetime-local"><button id="setReminder">Set Reminder</button><button class="light" id="clearReminder">Clear Reminder</button></section>
<section><div class="row"><button class="light" id="clear">🧹 Clear</button><button class="light" id="open">🎫 Railway</button></div><div class="row"><button class="light" id="export">📤 Export</button><input id="import" type="file" accept=".json"></div><button class="light" id="theme">🌙 Dark Mode</button></section>
<p id="status"></p></main><footer>Review every detail. CAPTCHA, OTP and payment are always completed manually.</footer><script src="popup.js"></script></body></html>
